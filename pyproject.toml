[project]
name = "travel-price-monitor"
version = "0.1.0"
description = "Track and monitor travel package prices"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
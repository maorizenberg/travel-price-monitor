name: Scrape Travel Prices

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      albania:
        description: Scrape Albania
        required: false
        default: false
        type: boolean
      romania:
        description: Scrape Romania
        required: false
        default: false
        type: boolean
      macedonia:
        description: Scrape North Macedonia
        required: false
        default: false
        type: boolean
      scheduled_test:
        description: TEMP - force scheduled logic
        required: false
        default: false
        type: boolean

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright Chromium
        run: uv run playwright install chromium

      - name: Run scraper
        run: |
          is_scheduled="${{ github.event_name == 'schedule' || inputs.scheduled_test == 'true' }}"
          if [ "$is_scheduled" == "false" ] && [ "${{ inputs.albania }}" == "true" ]; then
            uv run python -m travel_monitor.main --albania
          fi
          if [ "$is_scheduled" == "true" ] || [ "${{ inputs.romania }}" == "true" ]; then
            uv run python -m travel_monitor.main --romania
          fi
          if [ "$is_scheduled" == "true" ] || [ "${{ inputs.macedonia }}" == "true" ]; then
            uv run python -m travel_monitor.main --macedonia
          fi

      - name: Commit price history
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f .travel-monitor/price_history.json
          git diff --cached --quiet || git commit -m "Update price history [skip ci]"
          git push
